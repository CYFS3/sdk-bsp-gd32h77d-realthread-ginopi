# Studio scans the first two ZIP path levels for the BSP YAML.
project:
  name: GD32H77D-Gino
  title: GD32H77D Gino SDK
  title_en: GD32H77D Gino SDK
  description: GD32H77D Gino 开发板使用指南与示例工程文档。
  description_en: Guides and examples for the GD32H77D Gino board.
  version: '1.0.0'
  author: CYFS
  copyright: 2026, CYFS

repository:
  name: sdk-bsp-gd32h77d-gino
  projects_dir: ../content
  docs_dir: .

categories:
  docs:
    name: 开发指南
    name_en: Developer Guides
  projects:
    name: 示例工程
    name_en: Example Projects

generation:
  discovery:
    mode: recursive_tree
  navigation:
    mode: directory_tree
    maxdepth: -1
    titles_only: true
    show_local_toc: true
    order: [docs, projects]
  output_structure: [docs, projects]
  language_detection:
    zh: README_zh.md
    en: README.md
  default_language: zh
  default_page:
    zh: README_zh.md
    en: README.md
  directory_index:
    zh: README_zh.md
    en: README.md
  sync_extensions: [.md, .rst, .png, .jpg, .jpeg, .gif, .svg, .webp, .pdf, .pack]

sphinx:
  theme: sphinx_rtd_theme
  extensions: [myst_parser]
  source_suffix:
    .rst: restructuredtext
    .md: markdown
  myst_extensions: [colon_fence, deflist, dollarmath, html_image, html_admonition, strikethrough, tasklist]

giscus:
  enabled: false
