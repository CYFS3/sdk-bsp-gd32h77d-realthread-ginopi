name: Build Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'source/**'
      - 'figures/**'
      - 'projects/**/README*.md'
      - 'projects/**/figures/**'
      - 'projects/**/image/**'
      - 'projects/**/SConstruct'
      - 'tools/mdk_pack/**'
      - 'tools/check_docs.py'
      - '.github/versions.json'
      - '.github/workflows/build-docs.yml'
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'source/**'
      - 'figures/**'
      - 'projects/**/README*.md'
      - 'projects/**/figures/**'
      - 'projects/**/image/**'
      - 'projects/**/SConstruct'
      - 'tools/mdk_pack/**'
      - 'tools/check_docs.py'
      - '.github/versions.json'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Check template document discovery
        run: python -m unittest discover -s source/tests -p test_document_catalog.py -v
      - name: Validate documentation versions
        run: python source/build.py --validate --no-auto-install
      - name: Install PDF toolchain and fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese fonts-texgyre fonts-dejavu-core \
            fontconfig curl locales
          sudo install -d /usr/local/share/fonts/source-code-pro
          for font in SourceCodePro-Regular.ttf SourceCodePro-Bold.ttf SourceCodePro-It.ttf SourceCodePro-BoldIt.ttf; do
            sudo curl --fail --location --retry 3 --silent --show-error \
              "https://cdn.jsdelivr.net/gh/adobe-fonts/source-code-pro@release/TTF/${font}" \
              --output "/usr/local/share/fonts/source-code-pro/${font}"
          done
          sudo fc-cache -f -v
          sudo locale-gen zh_CN.UTF-8 en_US.UTF-8
      - name: Verify PDF toolchain
        run: python source/utils/pdf_environment.py --no-auto-install
      - name: Build all documentation versions
        run: |
          # Build the checked-out PR or development commit as the latest version.
          DOCS_LATEST_BRANCH=$(python -c 'import json; c=json.load(open(".github/versions.json")); print(next(v["branch"] for v in c["versions"] if v["name"] == c["latest_version"]))')
          git switch --force-create "$DOCS_LATEST_BRANCH" HEAD
          cd source
          python build.py --clean --no-auto-install
      - name: Check published documentation
        run: python tools/check_docs.py source/source_build/html --versions
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: source/source_build/html
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: source/source_build/html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: source/source_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
