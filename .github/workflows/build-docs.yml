name: Build Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'figures/**'
      - 'projects/**/README*.md'
      - 'projects/**/figures/**'
      - 'projects/**/image/**'
      - 'projects/**/SConstruct'
      - 'tools/mdk_pack/**'
      - 'tools/build_docs.py'
      - '.github/workflows/build-docs.yml'
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/**'
      - 'figures/**'
      - 'projects/**/README*.md'
      - 'projects/**/figures/**'
      - 'projects/**/image/**'
      - 'projects/**/SConstruct'
      - 'tools/mdk_pack/**'
      - 'tools/build_docs.py'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout documentation builder
        uses: actions/checkout@v4
        with:
          repository: kurisaW/sdk_build_doc_template
          ref: 6c5b5b040b45dbb936bf389d90ecbaadc32b42de
          path: .doc-template
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .doc-template/source/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r .doc-template/source/requirements.txt
      - name: Build and check bilingual documentation
        run: python tools/build_docs.py --template .doc-template
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
